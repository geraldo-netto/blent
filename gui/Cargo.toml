[package]
name = "blent-gui"
version = "1.2.3"
edition = "2021"
description = "Settings and status GUI for the blent USB display server"

[dependencies]
blent-config = { path = "../common" }
eframe = "0.32"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
blent = { path = "../host", features = ["accessory-transport"] }
x11rb = { version = "0.13.2", features = ["randr"] }
raw-window-handle = "0.6.2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dev-dependencies]
winit = "0.30.13"
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Registry", "Win32_Security"] }
