allprojects { project ->
    project.afterEvaluate {
        if (plugins.hasPlugin('com.android.application')) {
            android.sourceSets.getByName('test').java.srcDir(new File(rootProject.projectDir.parentFile, 'scripts/benchmarks/android-hosted'))
            dependencies.add('testImplementation', 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.2')
            android.sourceSets.getByName('test').java.srcDir(new File(rootProject.projectDir.parentFile, 'scripts/benchmarks/android-tunnel'))
            [tunnelHandoffBenchmark: 'TunnelHandoffBenchmarkKt', localHandoffBenchmark: 'LocalHandoffBenchmarkKt',
             tunnelReadBenchmark: 'TunnelReadBenchmarkKt'].each { taskName, entryPoint ->
                tasks.register(taskName, JavaExec) {
                    dependsOn 'compileDebugUnitTestKotlin', 'compileDebugUnitTestJavaWithJavac',
                        'processDebugUnitTestJavaRes', 'generateDebugUnitTestConfig'
                    classpath = tasks.named('testDebugUnitTest', Test).get().classpath
                    mainClass = 'com.blent.connection.' + entryPoint
                    args providers.gradleProperty('blentTunnelOutput').get()
                    if (taskName != 'localHandoffBenchmark') {
                        args new File(rootProject.projectDir.parentFile, 'testdata/connection-tls').absolutePath
                    }
                    if (taskName == 'tunnelReadBenchmark') {
                        args providers.gradleProperty('blentPeerGatherBytes').orElse('0').get()
                    }
                }
            }
        }
    }
}
