[package]
name = "blent"
default-run = "blent"
version = "1.2.3"
edition = "2021"
description = "Low-latency USB display server - turns your Android tablet into a second monitor"

[[example]]
name = "secure_connection_fixture"
required-features = ["accessory-transport"]

[[bin]]
name = "blent-audio"
path = "src/bin/audio.rs"
required-features = ["native-audio"]

[[bin]]
name = "blent-usb-broker"
path = "src/bin/usb_broker.rs"
required-features = ["accessory-transport"]

[features]
# T846 remains experimental until native pairing/media acceptance passes.
accessory-transport = ["dep:rustls", "dep:tokio-rustls", "dep:rcgen"]
native-audio = ["dep:pipewire"]
# Native libavcodec in a private Blent worker; the historical feature name stays.
# Raw shared slots cross exec without another raw-frame copy. Off by default on purpose: it needs the ffmpeg
# development headers at build time, which not every distribution installs by
# default and which atomic distributions make awkward. The CLI path stays the
# supported default so the project builds anywhere.
inproc-encoder = ["ffmpeg-next"]

[dependencies]
rustls = { version = "0.23.45", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.5", optional = true, default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", optional = true, default-features = false, features = ["ring"] }
blent-config = { path = "../common" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
socket2 = "0.6"
simd-adler32 = "0.3"
sha2 = "0.10"
futures-util = { version = "0.3", features = ["sink"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-tungstenite = "0.21"
toml = "0.8"

tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.8", optional = true }
ffmpeg-next = { version = "9", optional = true }
libc = "0.2"
zbus = { version = "4", features = ["tokio"] }
# Share AccessKit's zbus 5 runtime in workspace builds. Enabling Tokio here
# makes AccessKit's dedicated async-io worker panic without a Tokio reactor.
ksni = { version = "0.3", default-features = false, features = ["async-io"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
tracing = { version = "0.1", features = ["log"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader",
    "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[[example]]
name = "accessory_probe"
path = "examples/accessory_probe.rs"
required-features = ["accessory-transport"]
