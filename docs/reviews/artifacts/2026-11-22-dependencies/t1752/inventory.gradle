import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier
allprojects { project ->
    afterEvaluate {
        if (project.path == ':app') {
            tasks.register('blentRuntimeInventory') {
                doLast {
                    def runtime = configurations.getByName('releaseRuntimeClasspath')
                    def components = runtime.incoming.resolutionResult.allComponents.collect { it.id }
                        .findAll { it instanceof ModuleComponentIdentifier }
                        .collect { "${it.group}:${it.module}:${it.version}" }.sort()
                    def artifacts = runtime.resolvedConfiguration.resolvedArtifacts.collect {
                        [coordinate: it.moduleVersion.id.toString(), file: it.file.absolutePath]
                    }.sort { it.coordinate }
                    new File(project.property('blentInventoryOutput')).text =
                        JsonOutput.prettyPrint(JsonOutput.toJson([components:components, artifacts:artifacts]))
                }
            }
        }
    }
}
