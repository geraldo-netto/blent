allprojects { project ->
    project.afterEvaluate {
        tasks.withType(Test).configureEach {
            filter {
                includeTestsMatching 'com.blent.connection.ConnectionPreferencesTest'
                includeTestsMatching 'com.blent.connection.ConnectionWorkerCodecTest'
                includeTestsMatching 'com.blent.connection.ConnectionWaitTest'
            }
            afterTest { descriptor, result ->
                new File('/tmp/blent-t1098-evidence/completed-tests.log').append("${descriptor.className}.${descriptor.name}: ${result.resultType}\n")
            }
        }
    }
}
